# AIEC company server - free plan, nothing to create by hand.
# Cloudflare Workers -> Create -> Connect GitHub -> this repository, production branch "main", root folder "server", then Deploy.
name = "aiec-server"
main = "do.mjs"
compatibility_date = "2025-04-01"
workers_dev = true

[[durable_objects.bindings]]
name = "COMPANY"
class_name = "Company"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Company"]

# Optional: a setup secret (npx wrangler secret put ADMIN_SECRET). Without it, the first office phone that turns the
# server on claims it for the company.
