<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>AIEC Elevator OS</title>

<style>
:root{
  --ink:#1b1f2a;--muted:#545c6b;--bg:#f4f2ed;--card:#fff;--line:#dcd5c8;
  --graph:#23262f;--graph2:#353945;--gold:#c9a227;--gold-l:#f7eed2;--gold-d:#7a5f0c;
  --ok:#16703a;--ok-bg:#e2f3e7;--warn:#8a5300;--warn-bg:#fff0d2;--bad:#a3241c;--bad-bg:#fde6e3;--info:#1c5596;--info-bg:#e4eefa;
  --r:16px;--shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05);
}
html{font-size:17px}
html[data-size="l"]{font-size:19.5px}
html[data-size="xl"]{font-size:22px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",Mangal,sans-serif;line-height:1.45;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:110px;position:relative}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:var(--graph);color:#fff;display:flex;align-items:center;gap:6px;padding:6px 8px;min-height:62px}
.top h1{font-size:1.08rem;margin:0 4px;flex:1;line-height:1.2;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:12px;min-width:48px;min-height:48px;padding:0 9px;display:inline-flex;align-items:center;justify-content:center;gap:4px;font-size:1rem;font-weight:600;flex:none}
.badge{background:var(--gold);color:#111;border-radius:999px;font-size:.75rem;font-weight:800;padding:1px 7px;min-width:22px;text-align:center}
.practice{background:repeating-linear-gradient(45deg,#ffe08a,#ffe08a 12px,#ffd04d 12px,#ffd04d 24px);color:#3a2b00;text-align:center;font-weight:800;padding:6px 10px;font-size:.9rem}
.wrap{padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px;box-shadow:var(--shadow)}
.card h2,.card h3{margin:0 0 8px;font-size:1.05rem}
h2.sec{font-size:1.05rem;margin:18px 2px 8px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.row{display:flex;gap:10px;align-items:center}
.row>.grow{flex:1;min-width:0}
.wrapw{flex-wrap:wrap}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;padding:10px 16px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:1.05rem;font-weight:700;text-align:center;text-decoration:none;color:var(--ink)}
.btn .i{font-size:1.5rem;line-height:1}
.btn-p{background:var(--graph);color:#fff;border-color:var(--graph);box-shadow:inset 0 -4px 0 var(--gold)}
.btn-ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn-bad{color:var(--bad);border-color:var(--bad)}
.btn-big{min-height:78px;font-size:1.2rem;border-radius:18px}
.btn-sm{min-height:48px;font-size:.95rem;width:auto;padding:6px 14px;display:inline-flex}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.stack>*+*{margin-top:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles.one{grid-template-columns:1fr}
.tiles.three{grid-template-columns:1fr 1fr 1fr}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:104px;padding:12px 8px;border-radius:16px;border:2px solid var(--line);background:#fff;font-weight:700;text-align:center;font-size:1rem;color:var(--ink)}
.tile .i{font-size:2.2rem;line-height:1}
.tile small{font-weight:500;color:var(--muted);font-size:.82rem}
.tile.on{border-color:var(--graph);background:var(--gold-l);box-shadow:inset 0 0 0 2px var(--gold)}
.tile.on::after{content:"✓";position:absolute;top:6px;right:8px;background:var(--graph);color:#fff;border-radius:50%;width:24px;height:24px;font-size:.85rem;display:flex;align-items:center;justify-content:center}
.tiles.one .tile{flex-direction:row;justify-content:flex-start;min-height:70px;text-align:left;padding:12px 40px 12px 14px;gap:14px}
.tiles.one .tile .i{font-size:1.9rem}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:.82rem;font-weight:700;border:1px solid transparent;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.c-ok{background:var(--ok-bg);color:var(--ok);border-color:#b7dfc4}
.c-warn{background:var(--warn-bg);color:var(--warn);border-color:#f0d39a}
.c-bad{background:var(--bad-bg);color:var(--bad);border-color:#f3bdb7}
.c-info{background:var(--info-bg);color:var(--info);border-color:#bcd3f0}
.c-mute{background:#eeebe4;color:#4a4f5a;border-color:#ddd6c9}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.nav-in{display:flex;max-width:560px;width:100%}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:66px;border:0;background:none;color:var(--muted);font-size:.76rem;font-weight:700;gap:2px;border-top:4px solid transparent;padding:4px 2px}
.nav button .i{font-size:1.5rem;line-height:1.1}
.nav button.on{color:var(--ink);border-top-color:var(--gold);background:var(--gold-l)}
.task{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px;min-height:78px;margin-bottom:10px;color:var(--ink)}
.task .ti{width:54px;height:54px;border-radius:14px;background:var(--gold-l);display:flex;align-items:center;justify-content:center;font-size:1.7rem;flex:none}
.task b{display:block;font-size:1.02rem}
.task .go{font-size:1.4rem;color:var(--muted)}
.task.urgent{border-color:#e7a29b}
.prog{height:12px;background:#e7e2d7;border-radius:99px;overflow:hidden}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#e3c463);border-radius:99px}
.stepline{display:flex;justify-content:space-between;align-items:center;margin:2px 0 6px;font-weight:800}
.phases{display:flex;gap:3px;padding:4px 0}
.ph{flex:1;min-width:0;text-align:center;font-size:.6rem;letter-spacing:-.2px;line-height:1.15;padding:6px 0;border-radius:10px;background:#eeebe4;color:#555;font-weight:700;overflow-wrap:anywhere}
.ph .i{display:block;font-size:1.25rem}
.ph.done{background:var(--ok-bg);color:var(--ok)}
.ph.now{background:var(--gold-l);color:#3d2f00;outline:2px solid var(--gold)}
.big-i{font-size:3.6rem;text-align:center;line-height:1.1;margin:4px 0}
.say{font-size:1.15rem;font-weight:700;text-align:center;margin:6px 0 14px}
.field{display:block;margin:0 0 14px}
.field>span{display:block;font-weight:800;margin-bottom:5px}
.in{width:100%;min-height:54px;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:1.1rem;background:#fff}
.in:focus{border-color:var(--graph);outline:none}
textarea.in{min-height:96px;resize:vertical}
.in.big{font-size:1.6rem;letter-spacing:2px;font-weight:700}
.in-row{display:flex;gap:8px}
.in-row .in{flex:1;min-width:0}
.mic{min-width:56px;min-height:54px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:1.4rem;flex:none}
.mic.rec{background:var(--bad-bg);border-color:var(--bad)}
.stepper{display:flex;align-items:center;justify-content:center;gap:16px;margin:8px 0}
.stepper button{width:74px;height:74px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:2.2rem;font-weight:800;line-height:1}
.stepper output{font-size:2.8rem;font-weight:800;min-width:90px;text-align:center}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.ph-th{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#ccc;border:0;padding:0;display:block;width:100%}
.ph-th img{width:100%;height:100%;object-fit:cover;display:block}
.ph-th .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.7);color:#fff;border:0;border-radius:50%;width:36px;height:36px;font-size:1rem}
.ph-th .flag{position:absolute;bottom:3px;left:3px;font-size:.7rem;padding:1px 6px}
.ph-th .vid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2rem;color:#fff;text-shadow:0 1px 4px #000}
.err{background:var(--bad-bg);color:var(--bad);border:1px solid #f3bdb7;border-radius:12px;padding:10px 12px;font-weight:700;margin:10px 0}
.note{background:var(--info-bg);color:#0f3866;border-radius:12px;padding:10px 12px;font-size:.92rem;margin:10px 0}
.warnbox{background:var(--warn-bg);color:#5e3800;border-radius:12px;padding:10px 12px;font-size:.92rem;margin:10px 0;border:1px solid #f0d39a}
.okbox{background:var(--ok-bg);color:#0d4a25;border-radius:12px;padding:10px 12px;font-size:.92rem;margin:10px 0;border:1px solid #b7dfc4}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:25;background:linear-gradient(180deg,rgba(244,242,237,0),var(--bg) 24%);padding:18px 14px calc(12px + env(safe-area-inset-bottom))}
.foot-in{max-width:532px;margin:0 auto;display:flex;gap:10px}
.foot-in .btn{flex:1}
.kv{display:grid;grid-template-columns:minmax(80px,38%) 1fr;gap:6px 12px;font-size:.95rem;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.tl{border-left:3px solid var(--line);margin-left:10px;padding-left:14px}
.tl-i{position:relative;margin-bottom:14px}
.tl-i::before{content:"";position:absolute;left:-22px;top:5px;width:13px;height:13px;border-radius:50%;background:var(--gold);border:2px solid #fff}
.bubble{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin:0 0 8px;max-width:90%}
.bubble.mine{margin-left:auto;background:var(--gold-l)}
.sysmsg{text-align:center;font-size:.8rem;color:var(--muted);margin:8px 0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;position:sticky;top:62px;background:var(--bg);z-index:10}
.tabs button{white-space:nowrap;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:.92rem;min-height:46px;display:inline-flex;align-items:center;gap:4px}
.tabs button.on{background:var(--graph);color:#fff;border-color:var(--graph)}
.overlay{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column}
.overlay video,.overlay .pv{flex:1;width:100%;object-fit:contain;background:#000;min-height:0}
.cam-top{color:#fff;padding:12px 14px;font-weight:800;font-size:1.05rem;background:#111}
.cam-bar{display:flex;justify-content:space-around;align-items:center;padding:14px 10px calc(14px + env(safe-area-inset-bottom));background:#111;gap:10px}
.cam-bar .btn{width:auto;flex:1}
.shutter{width:86px;height:86px;border-radius:50%;border:6px solid #fff;background:var(--gold);flex:none}
.shutter.rec{background:var(--bad)}
.sheet{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--bg);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sig{background:#fff;border:2px dashed var(--graph);border-radius:12px;width:100%;height:240px;touch-action:none;display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:118px;z-index:200;background:var(--graph);color:#fff;padding:12px 18px;border-radius:14px;max-width:92%;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;border-left:5px solid var(--gold);color:var(--ink);width:100%;min-width:0;overflow-wrap:anywhere}
.kpi b{display:block;font-size:1.35rem}
.kpi.act{border-left-color:var(--ok)}
.kpi.est{border-left-color:var(--info)}
.kpi.alert{border-left-color:var(--bad)}
.bar{display:flex;align-items:center;gap:8px;font-size:.86rem;margin:5px 0}
.bar .lb{width:42%;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .b{flex:1;height:14px;background:#ece7dc;border-radius:7px;overflow:hidden}
.bar .b i{display:block;height:100%;background:var(--graph)}
.doc{background:#fff;padding:20px;border-radius:8px;border:1px solid var(--line);font-size:.95rem}
.doc h1{font-size:1.25rem;margin:0 0 2px}
.doc h3{margin:16px 0 6px;font-size:1rem}
.doc table{width:100%;border-collapse:collapse;margin:8px 0}
.doc td,.doc th{border-bottom:1px solid #e3ddd0;padding:6px 4px;text-align:left;vertical-align:top}
.doc .r{text-align:right;white-space:nowrap}
.doc .sigimg{height:70px;border-bottom:1px solid #999}
.hero{background:var(--graph);color:#fff;border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:inset 0 -5px 0 var(--gold)}
.hero .muted{color:#cfd3dc}
.logo{width:110px;height:110px;margin:0 auto;display:block}
.center{text-align:center}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:330px;margin:0 auto}
.pinpad button{min-height:70px;font-size:1.7rem;font-weight:800;border-radius:16px;border:2px solid var(--line);background:#fff}
.dots{display:flex;justify-content:center;gap:14px;margin:14px 0}
.dots i{width:20px;height:20px;border-radius:50%;border:3px solid var(--graph)}
.dots i.f{background:var(--graph)}
.map{width:100%;height:auto;background:#e8eee4;border-radius:var(--r);border:1px solid var(--line);display:block}
table.mx{border-collapse:collapse;font-size:.76rem;width:100%}
table.mx td,table.mx th{border:1px solid var(--line);padding:4px 3px;text-align:center}
table.mx td:first-child{text-align:left}
.list-item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.check-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.check-row:last-child{border-bottom:0}
.check-row .q{flex:1;font-weight:700}
.yn{display:flex;gap:6px}
.yn button{min-width:64px;min-height:50px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:800}
.yn button.on.y{background:var(--ok);color:#fff;border-color:var(--ok)}
.yn button.on.n{background:var(--bad);color:#fff;border-color:var(--bad)}
.lock{opacity:.55}
.cl-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border:2px solid var(--line);border-radius:14px;background:#fff;margin-bottom:8px;min-height:68px;color:var(--ink)}
.cl-item .st{font-size:1.6rem;flex:none;width:36px;text-align:center}
.cl-item.done{background:var(--ok-bg);border-color:#b7dfc4}
.cl-item.cur{border-color:var(--graph);box-shadow:inset 0 0 0 2px var(--gold)}
.illus{display:block;margin:0 auto 6px;max-width:220px;width:70%}
@media (prefers-reduced-motion:no-preference){.btn,.tile,.task,.cl-item{transition:transform .08s}.btn:active,.tile:active,.task:active,.cl-item:active{transform:scale(.98)}}
@media (max-width:360px){.tiles.three{grid-template-columns:1fr 1fr}.tile{min-height:92px}}
@media print{.top,.nav,.foot,.tabs,.practice,.noprint{display:none!important}body{background:#fff}#app{max-width:none;padding:0}.doc{border:0;padding:0}}
</style>

const KV = {

  async init() {

        r.onerror = () => { clearTimeout(to); rej(r.error); };

    }
  },
  tx(mode, fn) {
    return new Promise((res, rej) => {
      const r = fn(this.db.transaction('kv', mode).objectStore('kv'));
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  },
  async get(k) {
    if (this.mode === 'idb') return this.tx('readonly', s => s.get(k));
    if (this.mode === 'ls') { const v = localStorage.getItem('aiec:' + k); return v == null ? undefined : JSON.parse(v); }
    return this.mem.get(k);
  },
  async set(k, v) {
    if (this.mode === 'idb') return this.tx('readwrite', s => s.put(v, k));
    if (this.mode === 'ls') { try { localStorage.setItem('aiec:' + k, JSON.stringify(v)); } catch (e) { toast(t('err_storage_full'), true); throw e; } return; }
    this.mem.set(k, v);
  },
  async del(k) {
    if (this.mode === 'idb') return this.tx('readwrite', s => s.delete(k));
    if (this.mode === 'ls') return localStorage.removeItem('aiec:' + k);
    this.mem.delete(k);
  },
  async keys(prefix) {
    let all;
    if (this.mode === 'idb') all = await this.tx('readonly', s => s.getAllKeys());
    else if (this.mode === 'ls') all = Object.keys(localStorage).filter(k => k.startsWith('aiec:')).map(k => k.slice(5));

  if (ev.type === 'ORG_CREATED') return S.org ? 'err_org_exists' : need(ev.data.orgId && ev.data.name, 'err_fill');
  if (!S.org) return 'err_no_org';
  const isBoot = ev.type === 'USER_ADDED' && !Object.keys(S.users).length;
  /* first Owner; in a one-person file the Owner's PIN is removed (stripped), so nobody can log in as them there */
  if (isBoot) return (ev.data.role === 'owner' && ev.by === ev.data.uid && ev.data.name && (ev.data.pin || ev.data.stripped)) ? null : 'err_boot';
  const u = S.users[ev.by];
  if (!u || !u.active) return 'err_no_user';
  if (!R.roles.includes(u.role)) return { k: 'err_role', v: { roles: rolesTxt(R.roles) } };
  let P = null;
  if (R.project) {

    if (!R.open && !canSee(u, P)) return 'err_access';
    if (R.stages && !R.stages.includes(P.stage)) return { k: 'err_stage', v: { stage: stName(P.stage) } };

}

/* ---------- what must happen next (single task engine) ---------- */
function needs(P) {
  const out = [], add = (k, roles, o = {}) => out.push(Object.assign({ k, roles, pid: P.id }, o));
  const payNeed = purpose => {
    const p = activePay(P, purpose);
    if (!p) add('record_payment', ['sales', 'finance'], { uids: [P.sales], purpose });
    else if (p.status === 'pending') add('verify_payment', ['finance'], { not: p.recordedBy, payId: p.id, purpose, urgent: true });
    return p && p.status === 'confirmed';
  };
  const q = lastQuote(P);
  switch (P.stage) {
    case 'new': add('review_lead', ['sales'], { uids: [P.sales] }); break;
    case 'returned': add('fix_lead', ['field'], { uids: [P.createdBy] }); break;
    case 'accepted': add('call_customer', ['sales'], { uids: [P.sales] }); break;
    case 'contacted': add('write_needs', ['sales'], { uids: [P.sales] }); break;
    case 'requirements': add('make_quote', ['sales'], { uids: [P.sales] }); break;
    case 'quote_approval': add('approve_quote', ['owner', 'admin'], { not: q && q.by, urgent: true }); break;
    case 'quote_ready': add('send_quote', ['sales'], { uids: [P.sales] }); break;
    case 'quoted': add('get_decision', ['sales'], { uids: [P.sales] }); break;
    case 'won': add('prepare_agreement', ['sales'], { uids: [P.sales] }); break;
    case 'agreement': add('sign_agreement', P.customer ? ['customer', 'sales'] : ['sales'], { uids: [P.customer, P.sales] }); break;
    case 'signed': payNeed('token'); break;
    case 'site_prep': add(prepDone(P) ? 'request_qc' : 'prepare_site', P.customer ? ['customer', 'sales'] : ['sales'], { uids: [P.customer, P.sales] }); break;
    case 'qc_site': add('inspect_site', ['qc']); break;
    case 'site_fix': add(openCorr(P, 'site').length ? 'fix_site' : 'request_qc', P.customer ? ['customer', 'sales'] : ['sales'], { uids: [P.customer, P.sales] }); break;
    case 'site_ok': add('release', ['admin', 'owner']); break;
    case 'material_order': add('dispatch', ['supplier'], { uids: [P.supplier] }); break;
    case 'dispatched': add('arrival', ['tech', 'supplier'], { uids: [P.tech, P.supplier] }); break;
    case 'arrived': if (payNeed('arrival') && !openIncidents(P).length) add('material_handover', ['tech'], { uids: [P.tech] }); break;
    case 'installing': add(sopNext(P) < SOP.length ? 'install' : 'request_inspection', ['tech'], { uids: [P.tech] }); break;
    case 'qc_final': add('final_inspect', ['qc']); break;
    case 'install_fix': add(openCorr(P, 'install').length ? 'fix_install' : 'request_inspection', ['tech'], { uids: [P.tech] }); break;
    case 'final_pay': payNeed('final'); break;
    case 'handover':
      if (SLOTS.every(s => P.hand[s])) add('complete_handover', ['admin', 'owner', 'qc']);
      else {
        if (!P.hand.customer) add('sign_handover', P.customer ? ['customer', 'tech'] : ['tech'], { uids: [P.customer, P.tech], slot: 'customer' });
        if (!P.hand.tech) add('sign_handover', ['tech'], { uids: [P.tech], slot: 'tech' });
        if (!P.hand.qc) add('sign_handover', ['qc'], { slot: 'qc' });
      }
      break;
  }
  for (const b of P.blockers) if (b.open) add('resolve_blocker', uniq([b.role, 'admin']), { bid: b.id, urgent: true });
  for (const i of P.incidents) if (i.open) add('resolve_incident', ['admin', 'owner'], { iid: i.id, urgent: true });
  if (P.followUp && SALES_TALK.includes(P.stage) && P.followUp.due <= todayStr()) add('follow_up', ['sales'], { uids: [P.sales], overdue: P.followUp.due < todayStr() });
  for (const m of P.chat) if (m.open && m.toRole) add('answer', m.kind === 'approval' ? ['owner', 'admin'] : uniq([m.toRole]), { mid: m.id, not: m.by });
  return out;
}

/* simple automatic photo check (a warning only — a person decides) */
function photoQuality(dataUrl) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const w = 128, h = Math.max(8, Math.round(img.height / img.width * w));
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.drawImage(img, 0, 0, w, h);
      const d = x.getImageData(0, 0, w, h).data, g = new Float32Array(w * h);
      let mean = 0;
      for (let i = 0; i < w * h; i++) { g[i] = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2]; mean += g[i]; }
      mean /= w * h;
      let s = 0, s2 = 0, n = 0;
      for (let y = 1; y < h - 1; y++) for (let i = 1; i < w - 1; i++) {
        const k = y * w + i, l = 4 * g[k] - g[k - 1] - g[k + 1] - g[k - w] - g[k + w];
        s += l; s2 += l * l; n++;
      }
      const vr = s2 / n - (s / n) ** 2;
      res({ dark: mean < 45, blur: vr < 25, mean, vr });
    };
    img.onerror = () => res({});
    img.src = dataUrl;
  });
}

let wizBusy = false;

  payments: P => P.payments.some(p => p.status === 'pending'),
  blockers: P => P.blockers.some(b => b.open),
  incidents: P => P.incidents.some(i => i.open),

function dashboard() {

    ${kpi('est', money(pending), 'k_pending', 'tag_unverified', 'payments')}${kpi('est', money(Math.max(0, contract - confirmed)), 'k_receivable', 'tag_estimate', 'won')}

/* ---------- map (offline plot; tap a pin to open the project) ---------- */
SCREENS.map = () => {
  const u = App.me;
  App.pageSay = t('s_map');
  const f = App.form.mf || 'all';
  let ps = visibleProjects(u).filter(P => P.site.gps);
  if (f === 'mine') { const ids = new Set(myTasks(u).map(n => n.pid)); ps = ps.filter(P => ids.has(P.id)); }
  const route = u.role === 'field' ? Object.values(S.evidence).filter(e => e.by === u.uid && e.gps && e.t.slice(0, 10) === todayStr()).sort((a, b) => a.t < b.t ? -1 : 1).map(e => e.gps) : [];
  const me = Geo.fresh(600000);
  const pts = [...ps.map(P => P.site.gps), ...route, ...(me ? [me] : [])];
  let svg = `<div class="card center">${t('map_empty')}</div>`;
  if (pts.length) {
    let la0 = Math.min(...pts.map(p => p.lat)), la1 = Math.max(...pts.map(p => p.lat)), lo0 = Math.min(...pts.map(p => p.lng)), lo1 = Math.max(...pts.map(p => p.lng));
    const pad = Math.max(0.004, (la1 - la0) * 0.15, (lo1 - lo0) * 0.15); la0 -= pad; la1 += pad; lo0 -= pad; lo1 += pad;
    const k = Math.cos((la0 + la1) / 2 * Math.PI / 180), Wd = 360, span = Math.max((lo1 - lo0) * k, la1 - la0);
    const X = g => (g.lng - lo0) * k / span * Wd, Y = g => (la1 - g.lat) / span * Wd;
    const km = Math.max(0.1, Math.round(span * 111 / 4 * 10) / 10);
    svg = `<svg class="map" viewBox="0 0 ${Wd} ${Wd}" role="img" aria-label="${t('map')}">
      ${[1, 2, 3].map(i => `<line x1="${i * Wd / 4}" y1="0" x2="${i * Wd / 4}" y2="${Wd}" stroke="#cfd9c9"/><line x1="0" y1="${i * Wd / 4}" x2="${Wd}" y2="${i * Wd / 4}" stroke="#cfd9c9"/>`).join('')}
      ${route.length > 1 ? `<polyline points="${route.map(gp => X(gp) + ',' + Y(gp)).join(' ')}" fill="none" stroke="#1c5596" stroke-width="3" stroke-dasharray="6 4"/>` : ''}
      ${ps.map(P => `<g data-a="mapPin" data-v="${P.id}" style="cursor:pointer"><circle cx="${X(P.site.gps)}" cy="${Y(P.site.gps)}" r="${App.form.mp === P.id ? 17 : 13}" fill="${P.stage === 'lost' ? '#a3241c' : P.stage === 'amc' ? '#16703a' : '#23262f'}" stroke="#c9a227" stroke-width="3"/><text x="${X(P.site.gps)}" y="${Y(P.site.gps) + 5}" text-anchor="middle" font-size="13">${STAGES[P.stage][1]}</text></g>`).join('')}
      ${me ? `<circle cx="${X(me)}" cy="${Y(me)}" r="8" fill="#1c5596" stroke="#fff" stroke-width="3"/>` : ''}
      <line x1="12" y1="${Wd - 14}" x2="${12 + Wd / 4}" y2="${Wd - 14}" stroke="#333" stroke-width="3"/><text x="14" y="${Wd - 20}" font-size="11">${km} km</text></svg>`;
  }
  const sel = App.form.mp && S.projects[App.form.mp];
  const list = ps.slice().sort((a, b) => me ? haversine(me, a.site.gps) - haversine(me, b.site.gps) : 0);
  return topBar(t('map')) + `<main class="wrap"><div class="tabs" style="position:static;padding:0 0 10px">${[['all', '📋', 'all'], ['mine', '👉', 'mine']].map(([v, i, l]) => `<button class="${f === v ? 'on' : ''}" data-a="mfilter" data-v="${v}">${i} ${t(l)}</button>`).join('')}<button data-a="gpsMap">📍 ${t('where_am_i')}</button></div>
    ${svg}${sel ? `<div class="card" style="margin-top:10px">${projCard(sel).replace('class="task"', 'class="task" style="margin:0"')}<a class="btn" style="margin-top:8px" href="${dirLink(sel.site.gps)}" target="_blank" rel="noopener">🧭 ${t('directions')}</a></div>` : ''}
    <p class="small muted">🔵 ${t('map_me')} ${route.length ? ' · ┅ ' + t('map_route') : ''} · ${t('map_note')}</p>
    ${list.slice(0, 20).map(P => `<div class="list-item"><span class="grow">${STAGES[P.stage][1]} <b>${esc(P.id)}</b> · ${esc(projTitle(P))}</span>${me ? `<span class="chip c-mute">${(haversine(me, P.site.gps) / 1000).toFixed(1)} km</span>` : ''}<button class="btn btn-sm" data-a="openProject" data-v="${P.id}">▶</button></div>`).join('')}</main>` + nav('map');
};

async function importText(text) {

  if (!pack || pack.format !== 'aiec-elevator-os' || !Array.isArray(pack.events)) return { ok: false, msg: t('imp_bad') };
  if (pack.mode !== App.mode) return { ok: false, msg: t('imp_mode') };
  if (S.org && pack.org !== S.org.id) return { ok: false, msg: t('imp_org', { name: pack.orgName || '' }) };
  const have = new Set(EVENTS.map(e => e.id));
  let fresh = pack.events.filter(e => e && e.id && !have.has(e.id));

  if (S.org && pack.kind === 'person' && pack.for && pack.for === pack.by) { const ok = fresh.filter(e => e.by === pack.by); refused = fresh.length - ok.length; fresh = ok; }
  for (const [k, v] of Object.entries(pack.media || {})) { if (typeof v === 'string' && v.startsWith('data:')) { await KV.set(App.ns + 'm:' + k, v); MEDIA.set(k, v); } }
  const before = S.rejected.length;
  const all = EVENTS.concat(fresh);
  S = rebuild(all); EVENTS = all;

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.a]; if (!fn) return;
  if (el.tagName !== 'A' && el.tagName !== 'LABEL') e.preventDefault();
  App.lastActive = Date.now();
  Promise.resolve(fn(el.dataset.v, el, e)).catch(err => { console.error(err); toast(t('err_generic', { x: err.message }), true); });
});
document.addEventListener('input', e => {
  const el = e.target; App.lastActive = Date.now();
  if (el.dataset.k && W) {
    let v = el.value; if (el.type === 'number') v = v === '' ? '' : +v;
    setPath(W.ctx, el.dataset.k, v); saveDraft();

});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.aChange === 'import' && el.files && el.files[0]) { doImport(el.files[0]); el.value = ''; }
  if (el.type === 'checkbox' && el.dataset.f) App.form[el.dataset.f] = el.checked;
  if (el.type === 'date' && el.dataset.k && W) { setPath(W.ctx, el.dataset.k, el.value); saveDraft(); render(); }
});
['pointerdown', 'keydown'].forEach(n => document.addEventListener(n, () => { App.lastActive = Date.now(); }, { passive: true }));
/* lock after 20 minutes without use (session expiry) */
setInterval(() => {

}, 30000);

function sampleSign() {
  const c = document.createElement('canvas'); c.width = 600; c.height = 240;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, 600, 240);
  x.strokeStyle = '#123'; x.lineWidth = 4; x.beginPath(); x.moveTo(60, 160);
  for (let i = 0; i < 12; i++) x.bezierCurveTo(90 + i * 38, 40, 110 + i * 38, 220, 130 + i * 38, 140);
  x.stroke(); x.font = '20px sans-serif'; x.fillStyle = '#c9a227'; x.fillText('PRACTICE', 20, 30);
  return c.toDataURL('image/png');
}

  const T0 = Date.now() - 30 * 864e5; let tick = 0, cur = new Date(T0).toISOString();
  const at = () => { cur = new Date(Math.min(T0 + (tick++) * 2.4 * 3600e3, Date.now() - 3600e3 + tick * 1000)).toISOString(); return cur; };
  const SP = async (type, pid, data, who) => { const r = await perform(type, pid, data, { as: U[who] || who, t: at(), noSave: true, quiet: true }); if (!r.ok) console.warn('practice seed', type, pid, errText(r.err)); return r; };
  const media = {}, hash = {};
  for (const k of ['building', 'shaft', 'context', 'site', 'work']) { const d = samplePhoto(k); media[k] = await putMedia(d); hash[k] = await sha256(d); }
  { const d = sampleSign(); media.sign = await putMedia(d); hash.sign = await sha256(d); }
  const ph = (k, gps) => ({ id: 'E' + rid(10), m: media[k], kind: k === 'sign' ? 'sign' : 'photo', label: k, t: cur, gps: gps || null, hash: hash[k], dev: 'practice', q: {} });
  await SP('ORG_CREATED', null, { orgId: 'ORG-PRACTICE', name: 'AIEC (Practice)' }, 'owner');
  const people = [['owner', 'Anil Deshmukh', 'owner'], ['admin', 'Sunita Patil', 'admin'], ['field', 'Ramesh Jadhav', 'field'], ['field2', 'Sachin More', 'field'], ['sales', 'Priya Kulkarni', 'sales'],
    ['finance', 'Meena Joshi', 'finance'], ['qc', 'Vijay Shinde', 'qc'], ['supplier', 'Kaveri Lift Supply', 'supplier'], ['tech', 'Raju Pawar', 'tech']];
  for (const [k, name, role] of people) await SP('USER_ADDED', null, { uid: U[k], name, role, salt, pin }, k === 'owner' ? 'owner' : 'owner');
  const payStep = (P, purpose) => { const p = activePay(P, purpose); return !p ? ['sales', 'PAYMENT_RECORDED', { payId: 'PAY-' + rid(6), purpose, amount: P.schedule[purpose], method: 'upi', ref: 'UPI' + rid(8) }] : ['finance', 'PAYMENT_STATUS', { payId: p.id, status: 'confirmed', ref: 'BANK-' + rid(6) }]; };
  const AUTO = {
    new: () => ['sales', 'LEAD_ACCEPTED', {}],
    accepted: () => ['sales', 'CONTACT_LOGGED', { channel: 'call', outcome: 'interested', note: 'Wants lift for the building' }],
    contacted: P => ['sales', 'REQ_SAVED', { req: { use: P._use || 'apartment', stops: P._stops || 5, capacity: '6', type: 'auto', finish: P._fin || 'ss', shaft: 'yes', power: 'yes', timeline: '3m' } }],
    requirements: P => ['sales', 'QUOTE_CREATED', { discountPct: P._disc == null ? 5 : P._disc, reason: 'Opening offer' }],
    quote_approval: () => ['owner', 'QUOTE_DECISION', { decision: 'approve', reason: 'OK' }],
    quote_ready: () => ['sales', 'QUOTE_SENT', { channel: 'whatsapp' }],
    quoted: () => ['sales', 'DEAL_WON', {}],
    won: () => ['sales', 'AGREEMENT_PREPARED', {}],
    agreement: P => ['sales', 'AGREEMENT_SIGNED', { consent: true, signer: P.contact.name, ev: [ph('sign')] }],
    signed: P => payStep(P, 'token'),
    site_prep: P => { const k = PREP_ITEMS.find(([x]) => !P.prep[x]); return k ? ['sales', 'PREP_ITEM_DONE', { item: k[0], ev: [ph('site', P.site.gps)] }] : ['sales', 'QC_REQUESTED', {}]; },
    qc_site: P => ['qc', 'QC_SITE_RESULT', { meas: { width: 1800, depth: 1900, pit: 1500, head: 4200 }, checks: { plumb: 'yes', pit_dry: 'yes', power3: 'yes', barricade: 'yes', access: 'yes' }, outcome: 'approved', ev: [ph('site', P.site.gps), ph('shaft', P.site.gps)] }],
    site_ok: P => ['admin', 'RELEASED', { supplier: U.supplier, tech: U.tech, drawings: 'DWG-' + P.id + '-R1', materials: materialList(P.req) }],
    material_order: P => ['supplier', 'DISPATCHED', { packed: P.materials.map(m => m.k), seal: 'SEAL-' + P.id.slice(-3), vehicle: 'MH12 AB 1234', ev: [ph('work'), ph('work')] }],
    dispatched: P => ['tech', 'ARRIVED', { gps: P.site.gps, sealSeen: 'SEAL-' + P.id.slice(-3), sealIntact: 'yes', condition: 'good', ev: [ph('work', P.site.gps), ph('work', P.site.gps)] }],
    arrived: P => payConfirmed(P, 'arrival') ? ['tech', 'MATERIAL_HANDED', { items: P.materials.map(m => ({ k: m.k, q: m.q, status: 'ok' })), custName: P.contact.name, ev: [ph('sign'), ph('sign')] }] : payStep(P, 'arrival'),

    qc_final: P => ['qc', 'QC_FINAL_RESULT', { checks: Object.fromEntries(QC_FINAL_CHECKS.map(k => [k, 'pass'])), outcome: 'pass', ev: [ph('work', P.site.gps), ph('work', P.site.gps)] }],
    final_pay: P => payStep(P, 'final'),

    ['Om Sai Bungalow, Aundh, Pune', 'Mrs. Deshpande', '9822000006', 18.5580, 73.8075, 'signed', 'field', { _use: 'house', _stops: 3, _fin: 'ms' }],
    ['Krishna Plaza, Viman Nagar, Pune', 'Mr. Rao', '9822000007', 18.5679, 73.9143, 'quote_approval', 'field2', { _disc: 35 }],
    ['Vishal Towers, Hinjewadi, Pune', 'Mr. Kulkarni', '9822000010', 18.5913, 73.7389, 'quoted', 'field'],
    ['Near Swargate bus stand, Pune', 'Mr. Pawar', '9822000008', 18.5018, 73.8636, 'new', 'field'],

    if (extra) Object.assign(S.projects[pid], extra);

  /* finishing touches so every role has a real task to practise */
  const [amc, hand, hosp, sar, , , omsai, , vishal, , katraj] = ids;
  await SP('PAYMENT_RECORDED', omsai, { payId: 'PAY-' + rid(6), purpose: 'token', amount: S.projects[omsai].schedule.token, method: 'upi', ref: 'UPI' + rid(8) }, 'sales');
  for (const s of ['tech', 'qc']) await SP('HANDOVER_SIGNED', hand, { slot: s, consent: true, signer: userName(U[s]), ev: [ph('sign')] }, s);

  await SP('CHAT_POSTED', hand, { text: 'When will the lift start working for us?', kind: 'question', toRole: 'sales' }, 'customer');

  void amc; void sar;

}

async function boot() {
  await KV.init();
  try { App.set = (await KV.get('settings')) || {}; } catch (e) { App.set = {}; }
  if (!App.set.dev) App.set.dev = 'D' + rid(5);
  LANG = App.set.lang || 'mr';
  document.documentElement.dataset.size = App.set.size || 'n';
  Voice.init();
  history.replaceState({ aiec: 0 }, ''); history.pushState({ aiec: 1 }, '');
  await loadMode(App.set.mode === 'practice' ? 'practice' : 'real');
  await saveSettings();
  if (!App.set.lang) go('welcome', {}, { replace: true });
  else if (!S.org) go(App.mode === 'practice' ? 'login' : 'setup', {}, { replace: true });
  else go('login', {}, { replace: true });
  if (/^https?:$/.test(location.protocol)) {
    const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.appendChild(l);
    if (location.protocol === 'https:' && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
  }
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); App.installEvt = e; if (App.route.name === 'me') render(); });
  window.addEventListener('appinstalled', () => { App.installEvt = null; toast(t('installed_ok')); });
  window.addEventListener('offline', () => toast(t('offline_saved')));
  window.addEventListener('online', () => toast(t('online_again')));
}
